<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store · Perfil</title>
  <link rel="stylesheet" href="style.css">
  <script src="store.js" defer></script>
</head>
<body data-page="profile">
  <nav id="nav"></nav>
  <main>
    <h1>Perfil</h1>
    <section id="profile" class="card" hidden>
      <dl>
        <dt>Nome</dt><dd id="profile-name"></dd>
        <dt>E-mail</dt><dd id="profile-email"></dd>
        <dt>ID</dt><dd id="profile-id"></dd>
      </dl>
    </section>
    <p id="message" role="status"></p>
  </main>
</body>
</html>
