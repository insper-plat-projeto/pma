<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store · Entrar</title>
  <link rel="stylesheet" href="style.css">
  <script src="store.js" defer></script>
</head>
<body data-page="index" class="checking auth-page">
  <main class="auth">
    <h1>Store</h1>
    <p class="muted">A loja de paródias da plataforma. Entre ou crie uma conta para comprar.</p>

    <div class="segmented" role="tablist">
      <button type="button" id="tab-login" role="tab" aria-selected="true">Entrar</button>
      <button type="button" id="tab-register" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <form id="login-form">
      <label>E-mail <input id="login-email" type="email" required autocomplete="email"></label>
      <label>Senha <input id="login-password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
    </form>

    <form id="register-form" hidden>
      <label>Nome <input id="register-name" required autocomplete="name"></label>
      <label>E-mail <input id="register-email" type="email" required autocomplete="email"></label>
      <label>Senha <input id="register-password" type="password" required minlength="6" autocomplete="new-password"></label>
      <button type="submit">Criar conta</button>
    </form>

    <p id="message" role="status"></p>
  </main>
</body>
</html>
