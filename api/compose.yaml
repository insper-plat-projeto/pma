name: store

services:

  db:
    image: postgres:17
    volumes:
      - ${VOLUME_DB}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-store}
      POSTGRES_DB: ${DB_NAME:-store}
    healthcheck: # ready only when Postgres accepts connections, not just when the container starts
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-store} -d ${DB_NAME:-store}"]
      interval: 3s
      timeout: 3s
      retries: 20

  account:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    # no ports: reached only through the gateway, at http://account:8080
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-store}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    # no ports: reached only through the gateway, at http://auth:8080
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-EBwrdOOcAIDRLON9hbJV0+O3PTdfTjgMCQIxwLH7ws8=}
    depends_on:
      - account

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    # no ports: the lb is the entry point and spreads requests across the replicas
    deploy:
      replicas: 2
    depends_on:
      - account
      - auth
      - exchange

  lb:
    image: nginx:1.27-alpine
    ports:
      - 8080:80 # the only API entry point: the web front end calls localhost:8080
    volumes:
      - ${SETUP:-./setup}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  exchange:
    build:
      context: ./exchange-service
      dockerfile: Dockerfile
    # no ports: reached only through the gateway, at http://exchange:8080
    environment:
      PYTHONUNBUFFERED: 1

  redis:
    image: redis:7-alpine
    hostname: redis
    # no ports: only the services reach it; inspect with docker compose exec redis redis-cli
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:v3.5.0
    hostname: prometheus
    ports:
      - 9090:9090 # UI: Status -> Targets shows each service UP or DOWN
    volumes:
      - ${SETUP:-./setup}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - account
      - exchange

  grafana:
    image: grafana/grafana-enterprise:12.0.0
    hostname: grafana
    ports:
      - 3000:3000 # http://localhost:3000, admin / admin
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ${SETUP:-./setup}/grafana/provisioning:/etc/grafana/provisioning:ro # Prometheus datasource + dashboard provider
      - ${SETUP:-./setup}/grafana/dashboards:/var/lib/grafana/dashboards:ro # Store dashboard
    depends_on:
      - prometheus

volumes:
  redis_data: