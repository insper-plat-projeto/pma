events {}

http {

    # Docker DNS expands gateway:8080 to every replica at startup.
    # No algorithm line: Round Robin, each request goes to the next replica.
    upstream gateways {
        server gateway:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateways;
            # $http_host keeps the port (localhost:8080). With $host (no port) the gateway
            # sees a page at http://localhost as same-origin and leaves out the CORS headers.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
