# Prometheus pulls (scrapes) each target every scrape_interval.
# metrics_path must match the service's endpoint exactly, or the target is DOWN with a 404.
scrape_configs:

  - job_name: 'AccountMetrics'
    metrics_path: '/accounts/actuator/prometheus' # management.endpoints.web.base-path + /prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
        - account:8080 # Docker hostname, never localhost
        labels:
          application: 'Account Application'

  - job_name: 'ExchangeMetrics'
    metrics_path: '/exchanges/metrics' # prometheus-fastapi-instrumentator in exchange-service
    scrape_interval: 5s
    static_configs:
      - targets:
        - exchange:8080
        labels:
          application: 'Exchange Application'

